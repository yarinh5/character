name: Client media cleanup

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      execute_cleanup:
        description: Run one authorized bounded cleanup batch
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: client-media-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      (github.event_name == 'schedule' && vars.CLIENT_MEDIA_CLEANUP_SCHEDULE_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.execute_cleanup == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Claim and clean one bounded batch
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          set +e
          http_status="$(curl --fail-with-body --silent --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --data '{"limit":25}' \
            "${SUPABASE_URL%/}/functions/v1/cleanup-client-media")"
          curl_exit=$?
          set -e

          if [ "$curl_exit" -ne 0 ]; then
            echo "::error::client media cleanup request failed (curl exit $curl_exit; HTTP ${http_status:-unknown})"
            exit "$curl_exit"
          fi
          if [[ ! "$http_status" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::client media cleanup returned unexpected HTTP $http_status"
            exit 1
          fi

          node scripts/validate-client-media-cleanup-result.mjs < "$response_file"
